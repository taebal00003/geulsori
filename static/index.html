<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자막 통화</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --sub: #6b7280; --line: #e3e6eb;
  --accent: #2563eb; --accent-text: #ffffff; --me: #2563eb; --me-text: #ffffff;
  --peer: #eef0f4; --peer-text: #16181d; --danger: #dc2626; --ok: #16a34a;
  --mark: #fde047; --mark-text: #16181d; --fs: 18px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --card: #181b21; --text: #eef0f4; --sub: #9aa1ad; --line: #2a2f38;
    --accent: #3b82f6; --me: #2f6fe0; --peer: #252a33; --peer-text: #eef0f4;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; border-radius: 12px; padding: 12px 16px; background: var(--peer); }
button.primary { background: var(--accent); color: var(--accent-text); font-weight: 600; }
button.danger { background: var(--danger); color: #fff; font-weight: 600; }
button.ok { background: var(--ok); color: #fff; font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
input, textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.screen { display: none; max-width: 560px; margin: 0 auto; min-height: 100%; padding: 16px; }
.screen.on { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
h1 { font-size: 22px; margin: 8px 0 0; }
h2 { font-size: 17px; margin: 0; }
.sub { color: var(--sub); font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode { text-align: left; padding: 14px; border: 2px solid transparent; }
.mode.sel { border-color: var(--accent); }
.mode b { display: block; }
.number { font-size: 28px; font-weight: 700; letter-spacing: 1px; }
.center { text-align: center; align-items: center; justify-content: center; }
.big { font-size: 24px; font-weight: 700; }

/* 통화 화면 */
#call.on { padding: 0; height: 100dvh; gap: 0; }
.bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--card); }
.bar .grow { flex: 1; min-width: 0; }
.bar button { padding: 8px 12px; }
#log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: var(--fs); }
.bubble { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; }
.bubble.peer { align-self: flex-start; background: var(--peer); color: var(--peer-text); border-bottom-left-radius: 4px; }
.bubble.me { align-self: flex-end; background: var(--me); color: var(--me-text); border-bottom-right-radius: 4px; }
.bubble.interim { opacity: .75; border: 2px dashed var(--sub); background: transparent; color: var(--text); }
.bubble.sys { align-self: center; background: none; color: var(--sub); font-size: 14px; text-align: center; }
mark { background: var(--mark); color: var(--mark-text); border-radius: 4px; padding: 0 2px; }
#typing { padding: 0 14px 6px; color: var(--sub); font-size: 14px; min-height: 22px; }
.dock { border-top: 1px solid var(--line); background: var(--card); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.chips button { white-space: nowrap; padding: 8px 12px; font-size: 15px; flex-shrink: 0; }
.chips button.ai { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); }
.tabs { display: flex; gap: 4px; }
.tabs button { padding: 6px 10px; font-size: 14px; background: transparent; color: var(--sub); }
.tabs button.sel { background: var(--peer); color: var(--text); font-weight: 600; }
#refineCard { display: none; }
#refineCard.on { display: flex; }
#refineCard .opt { text-align: left; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--sub); }
.voiceHint { text-align: center; color: var(--sub); font-size: 15px; padding: 6px; }
.listening { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); margin-right: 6px; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
#endLog { max-height: 40vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.prepList { display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.prepList div { padding: 8px 10px; background: var(--peer); border-radius: 10px; }
.goal { font-weight: 700; }
.hidden { display: none !important; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
#toast.on { opacity: 1; }
</style>
</head>
<body>

<!-- 1. 설정 -->
<section id="setup" class="screen">
  <h1>자막 통화</h1>
  <p class="sub">각자 편한 방식으로 말하고 듣는 통화예요. 이름과 통화 방식을 골라 주세요.</p>
  <div class="card">
    <label>이름<input id="nameInput" maxlength="20" placeholder="예: 이주표"></label>
    <div class="modes">
      <button class="mode" data-mode="caption"><b>자막 모드</b><span class="sub">상대 말을 자막으로 보고, 글로 답하거나 직접 말해요</span></button>
      <button class="mode" data-mode="voice"><b>목소리 모드</b><span class="sub">평소처럼 말하고, 상대 글을 음성으로 들어요</span></button>
    </div>
    <button id="setupDone" class="primary">시작하기</button>
  </div>
</section>

<!-- 2. 홈 -->
<section id="home" class="screen">
  <div class="row"><h1 class="grow">자막 통화</h1><button id="editProfile">설정</button></div>
  <div class="card">
    <span class="sub" id="whoAmI"></span>
    <span class="sub">내 번호</span>
    <span class="number" id="myNumber">연결 중…</span>
  </div>
  <div class="card">
    <h2>전화 걸기</h2>
    <input id="dialInput" inputmode="numeric" maxlength="13" placeholder="상대 번호 11자리">
    <button id="callBtn" class="primary">전화 걸기</button>
  </div>
  <div class="card" id="prepCard">
    <h2>통화 준비 도우미</h2>
    <span class="sub">통화 목적을 적으면 상대가 물어볼 만한 질문과 답변을 미리 만들어 '준비' 탭에 넣어 둬요.</span>
    <textarea id="purposeInput" rows="2" placeholder="예: 치과 예약을 다음 주로 바꾸고 싶어"></textarea>
    <div class="row">
      <button id="prepBtn" class="primary grow">답변 미리 만들기</button>
      <button id="prepClear">지우기</button>
    </div>
    <div id="prepResult" class="prepList"></div>
  </div>
</section>

<!-- 3. 발신/수신 -->
<section id="ring" class="screen center">
  <div class="card center" style="width:100%;padding:40px 16px">
    <span class="sub" id="ringLabel"></span>
    <span class="big" id="ringName"></span>
    <span class="sub" id="ringInfo"></span>
  </div>
  <div class="row" style="width:100%">
    <button id="rejectBtn" class="danger grow">거절</button>
    <button id="acceptBtn" class="ok grow">받기</button>
    <button id="cancelBtn" class="danger grow">취소</button>
  </div>
</section>

<!-- 4. 통화 -->
<section id="call" class="screen">
  <div class="bar">
    <div class="grow"><b id="callName"></b><div class="sub" id="callInfo"></div></div>
    <button id="fontDown" aria-label="글자 작게">가-</button>
    <button id="fontUp" aria-label="글자 크게">가+</button>
    <button id="hangupBtn" class="danger">끊기</button>
  </div>
  <div id="log"></div>
  <div id="typing"></div>

  <!-- 자막 모드 입력 영역 -->
  <div class="dock" id="captionDock">
    <div class="card" id="refineCard">
      <span class="sub">이렇게 다듬어 볼까요?</span>
      <button class="opt primary" id="refinedOpt"></button>
      <button class="opt" id="originalOpt"></button>
    </div>
    <div class="chips" id="aiChips"></div>
    <div class="tabs" id="quickTabs"></div>
    <div class="chips" id="quickChips"></div>
    <div class="row">
      <input id="msgInput" class="grow" placeholder="보낼 말을 입력하세요" enterkeyhint="send">
      <button id="sendBtn" class="primary">보내기</button>
    </div>
    <div class="row">
      <label class="toggle"><input type="checkbox" id="refineToggle" style="width:auto" checked> 짧은 말 다듬기</label>
      <span class="grow"></span>
      <button id="talkBtn">🎙 직접 말하기</button>
    </div>
  </div>

  <!-- 목소리 모드 영역 -->
  <div class="dock" id="voiceDock">
    <div class="voiceHint" id="voiceHint"><span class="listening"></span>평소처럼 말씀하세요. 말이 자막으로 전달돼요.</div>
  </div>
</section>

<!-- 5. 종료 -->
<section id="ended" class="screen">
  <h1>통화가 끝났어요</h1>
  <span class="sub" id="endReason"></span>
  <div class="card" id="summaryCard">
    <h2>AI 통화 요약</h2>
    <div id="summaryBody" class="sub">요약하는 중…</div>
  </div>
  <div class="card">
    <div class="row"><h2 class="grow">통화 기록</h2><button id="copyBtn">복사</button></div>
    <div id="endLog"></div>
  </div>
  <button id="homeBtn" class="primary">처음으로</button>
</section>

<audio id="remoteAudio" autoplay playsinline></audio>
<div id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

// ---------- 저장소 (실패해도 동작하도록) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

const state = {
  profile: store.get("profile", null),    // {name, mode}
  number: store.get("number", null),
  prep: store.get("prep", null),          // {purpose, greeting, qa:[{question, answer}]}
  ai: false,
  peer: null, role: null,
  history: [],                            // [{who:"me"|"peer", text}]
  fontSize: store.get("fontSize", 18),
};

function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
}
let toastTimer;
function toast(msg) {
  $("toast").textContent = msg; $("toast").classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").classList.remove("on"), 2500);
}
const modeName = (m) => (m === "voice" ? "목소리 모드" : "자막 모드");
const fmtNum = (n) => n ? `${n.slice(0, 3)}-${n.slice(3, 7)}-${n.slice(7)}` : "";
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- 중요 정보 강조 (규칙 기반) ----------
const HIGHLIGHT = new RegExp([
  "01\\d-?\\d{3,4}-?\\d{4}",                                            // 전화번호
  "\\d[\\d,]*\\s?(?:만\\s?)?원",                                         // 금액
  "\\d{1,2}\\s?월\\s?\\d{1,2}\\s?일",                                    // 날짜
  "(?:오늘|내일|모레|글피|(?:이번|다음)\\s?주(?:\\s?[월화수목금토일]요일)?|[월화수목금토일]요일)",
  "(?:오전|오후|아침|점심|저녁|밤|낮|새벽)?\\s?\\d{1,2}\\s?시(?:\\s?\\d{1,2}\\s?분|\\s?반)?", // 시간
  "(?:\\d+|한|두|세|네|다섯|여섯|일곱|여덟|아홉|열)\\s?(?:명|분|사람|인분|개)", // 인원·수량
].join("|"), "g");
const highlight = (text) => esc(text).replace(HIGHLIGHT, (m) => `<mark>${m}</mark>`);

// ---------- 대화 로그 ----------
const interim = {};  // who -> 점선 말풍선
function addLine(who, text, { record = true } = {}) {
  clearInterim(who);
  const el = document.createElement("div");
  el.className = `bubble ${who}`;
  el.innerHTML = who === "sys" ? esc(text) : highlight(text);
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  if (record && who !== "sys") state.history.push({ who, text });
}
function setInterim(who, text) {
  let el = interim[who];
  if (!el) {
    el = interim[who] = document.createElement("div");
    el.className = `bubble ${who} interim`;
    $("log").appendChild(el);
  }
  el.textContent = text;
  $("log").scrollTop = $("log").scrollHeight;
}
function clearInterim(who) { if (interim[who]) { interim[who].remove(); delete interim[who]; } }
function applyFont() { document.documentElement.style.setProperty("--fs", state.fontSize + "px"); store.set("fontSize", state.fontSize); }

// ---------- WebSocket ----------
let ws, wsRetry = 0;
function send(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }
function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => {
    wsRetry = 0;
    send({ type: "register", name: state.profile.name, mode: state.profile.mode, number: state.number });
  };
  ws.onmessage = (e) => onMessage(JSON.parse(e.data));
  ws.onclose = () => {
    $("myNumber").textContent = "다시 연결 중…";
    if (state.peer) endCall("disconnected");
    setTimeout(connect, Math.min(1000 * 2 ** wsRetry++, 10000));
  };
}

function onMessage(m) {
  switch (m.type) {
    case "registered":
      state.number = m.number; store.set("number", m.number);
      $("myNumber").textContent = fmtNum(m.number);
      break;
    case "error":
      toast(m.message); if ($("ring").classList.contains("on")) show("home");
      break;
    case "ringing": showRing("out", m.peer); break;
    case "incoming": showRing("in", m.peer); break;
    case "connected": startCall(m.peer, m.role); break;
    case "ended": endCall(m.reason); break;
    case "caption":   // 상대(목소리 모드)의 음성 인식 자막
      if (m.final) { addLine("peer", m.text); onPeerFinal(); } else setInterim("peer", m.text);
      break;
    case "message":   // 상대(자막 모드)가 입력한 글
      addLine("peer", m.text); setTyping(false);
      if (state.profile.mode === "voice") speak(m.text);
      onPeerFinal();
      break;
    case "typing": setTyping(m.on); break;
    case "rtc": onRtc(m.data); break;
  }
}

// ---------- 설정 화면 ----------
let pickedMode = state.profile?.mode || "caption";
function renderModes() { document.querySelectorAll(".mode").forEach((b) => b.classList.toggle("sel", b.dataset.mode === pickedMode)); }
document.querySelectorAll(".mode").forEach((b) => b.onclick = () => { pickedMode = b.dataset.mode; renderModes(); });
$("setupDone").onclick = () => {
  const name = $("nameInput").value.trim();
  if (!name) return toast("이름을 입력해 주세요.");
  state.profile = { name, mode: pickedMode }; store.set("profile", state.profile);
  goHome();
  if (ws && ws.readyState === 1) ws.close(); else if (!ws) connect();
};
$("editProfile").onclick = () => { $("nameInput").value = state.profile.name; pickedMode = state.profile.mode; renderModes(); show("setup"); };

// ---------- 홈 / 통화 준비 도우미 ----------
function goHome() {
  $("whoAmI").textContent = `${state.profile.name} · ${modeName(state.profile.mode)}`;
  $("prepCard").classList.toggle("hidden", !state.ai || state.profile.mode !== "caption");
  renderPrep();
  show("home");
}
function renderPrep() {
  const p = state.prep;
  $("purposeInput").value = p?.purpose || $("purposeInput").value;
  $("prepResult").innerHTML = !p?.qa ? "" :
    `<div><b>첫인사</b><br>${esc(p.greeting)}</div>` +
    p.qa.map((x) => `<div><span class="sub">Q. ${esc(x.question)}</span><br>${esc(x.answer)}</div>`).join("");
}
$("prepBtn").onclick = async () => {
  const purpose = $("purposeInput").value.trim();
  if (!purpose) return toast("통화 목적을 입력해 주세요.");
  $("prepBtn").disabled = true; $("prepBtn").textContent = "만드는 중…";
  try {
    const r = await api("/api/prep", { purpose });
    state.prep = { purpose, ...r }; store.set("prep", state.prep); renderPrep();
  } catch (e) { toast(e.message); }
  $("prepBtn").disabled = false; $("prepBtn").textContent = "답변 미리 만들기";
};
$("prepClear").onclick = () => { state.prep = null; store.del("prep"); $("purposeInput").value = ""; renderPrep(); };

$("callBtn").onclick = () => {
  const to = $("dialInput").value.replace(/\D/g, "");
  if (to.length !== 11) return toast("번호 11자리를 입력해 주세요.");
  unlockAudio();
  send({ type: "call", to });
};

// ---------- 발신/수신 ----------
function showRing(dir, peer) {
  $("ringLabel").textContent = dir === "in" ? "전화가 왔어요" : "전화를 거는 중…";
  $("ringName").textContent = peer.name;
  $("ringInfo").textContent = `${fmtNum(peer.number)} · ${modeName(peer.mode)}`;
  $("acceptBtn").classList.toggle("hidden", dir !== "in");
  $("rejectBtn").classList.toggle("hidden", dir !== "in");
  $("cancelBtn").classList.toggle("hidden", dir === "in");
  show("ring");
}
$("acceptBtn").onclick = () => { unlockAudio(); send({ type: "accept" }); };
$("rejectBtn").onclick = () => { send({ type: "reject" }); show("home"); };
$("cancelBtn").onclick = () => { send({ type: "hangup" }); show("home"); };

// ---------- 통화 ----------
function startCall(peer, role) {
  state.peer = peer; state.role = role; state.history = [];
  $("log").innerHTML = ""; $("aiChips").innerHTML = ""; hideRefine(); setTyping(false);
  $("callName").textContent = peer.name;
  $("callInfo").textContent = `${fmtNum(peer.number)} · 상대는 ${modeName(peer.mode)}`;
  const caption = state.profile.mode === "caption";
  $("captionDock").classList.toggle("hidden", !caption);
  $("voiceDock").classList.toggle("hidden", caption);
  renderQuick(state.prep?.qa ? "준비" : "기본");
  show("call");

  if (caption) {
    addLine("sys", "상대의 말이 자막으로 표시돼요.", { record: false });
    if (state.prep?.greeting) $("msgInput").value = state.prep.greeting;
  } else {
    addLine("sys", "상대가 입력한 글을 음성으로 읽어 드려요.", { record: false });
    if (peer.mode === "caption") speak("상대방은 자막으로 통화하고 있어요. 천천히 또박또박 말씀해 주세요.");
    startStt();
  }
}

function endCall(reason) {
  if (!state.peer && !$("ring").classList.contains("on")) return;
  const wasInCall = !!state.peer;
  state.peer = null;
  stopStt(); stopTalk(); speechSynthesis.cancel(); setTyping(false);
  if (!wasInCall) {
    toast(reason === "rejected" ? "상대가 전화를 받지 않았어요." : "통화가 연결되지 않았어요.");
    return goHome();
  }
  const reasons = { hangup: "통화를 끝냈어요.", disconnected: "연결이 끊겼어요.", rejected: "" };
  $("endReason").textContent = reasons[reason] ?? "";
  $("endLog").innerHTML = state.history.map((l) =>
    `<div><b>${l.who === "me" ? "나" : "상대"}</b> ${highlight(l.text)}</div>`).join("") || '<span class="sub">대화 기록이 없어요.</span>';
  show("ended");
  summarize();
}
$("hangupBtn").onclick = () => { send({ type: "hangup" }); endCall("hangup"); };
$("homeBtn").onclick = goHome;
$("copyBtn").onclick = async () => {
  const text = state.history.map((l) => `${l.who === "me" ? "나" : "상대"}: ${l.text}`).join("\n");
  try { await navigator.clipboard.writeText(text); toast("복사했어요."); } catch { toast("복사하지 못했어요."); }
};
$("fontUp").onclick = () => { state.fontSize = Math.min(32, state.fontSize + 2); applyFont(); };
$("fontDown").onclick = () => { state.fontSize = Math.max(14, state.fontSize - 2); applyFont(); };

async function summarize() {
  if (!state.ai || state.history.length === 0) { $("summaryCard").classList.add("hidden"); return; }
  $("summaryCard").classList.remove("hidden");
  $("summaryBody").textContent = "요약하는 중…";
  try {
    const r = await api("/api/summary", { history: state.history, purpose: state.prep?.purpose || "" });
    $("summaryBody").innerHTML =
      r.summary.map((s) => `<div>• ${highlight(s)}</div>`).join("") +
      (state.prep?.purpose ? `<div style="margin-top:8px"><span class="goal">통화 목적: ${esc(r.goal)}</span> — ${esc(r.goal_reason)}</div>` : "");
  } catch (e) { $("summaryBody").textContent = e.message; }
}

// ---------- 자막 모드: 보내기, 다듬기, 빠른 문장, 입력 중 표시 ----------
const QUICK = {
  "기본": ["안녕하세요. 저는 청각장애가 있어 자막으로 통화하고 있어요.", "천천히 말씀해 주세요.", "다시 한 번 말씀해 주시겠어요?", "네, 맞아요.", "아니요.", "잠시만 기다려 주세요."],
  "약속": ["예약하고 싶어요.", "예약을 바꾸고 싶어요.", "가능한 시간이 언제인가요?", "그 시간 괜찮아요.", "다른 시간은 없을까요?", "주소를 문자로 보내 주실 수 있나요?"],
  "마무리": ["감사합니다.", "알겠습니다. 그렇게 할게요.", "확인했어요. 좋은 하루 보내세요.", "나중에 다시 연락드릴게요."],
};
let quickTab = "기본";
function renderQuick(tab) {
  const tabs = Object.keys(QUICK).concat(state.prep?.qa ? ["준비"] : []);
  quickTab = tabs.includes(tab) ? tab : "기본";
  $("quickTabs").innerHTML = "";
  tabs.forEach((t) => {
    const b = document.createElement("button");
    b.textContent = t; b.className = t === quickTab ? "sel" : "";
    b.onclick = () => renderQuick(t);
    $("quickTabs").appendChild(b);
  });
  const items = quickTab === "준비"
    ? [state.prep.greeting, ...state.prep.qa.map((x) => x.answer)]
    : QUICK[quickTab];
  fillChips($("quickChips"), items, "");
}
function fillChips(box, items, cls) {
  box.innerHTML = "";
  items.forEach((text) => {
    const b = document.createElement("button");
    b.textContent = text; b.className = cls;
    // 빈칸([이름] 등)이 남은 문장은 입력창으로 옮겨 채운 뒤 보내게 한다
    b.onclick = () => /\[[^\]]*\]/.test(text) ? (($("msgInput").value = text), $("msgInput").focus()) : sendText(text);
    box.appendChild(b);
  });
}

function sendText(text) {
  text = text.trim();
  if (!text || !state.peer) return;
  send({ type: "message", text });
  addLine("me", text);
  $("aiChips").innerHTML = "";
  stopTyping();
}

async function submitInput() {
  const text = $("msgInput").value.trim();
  if (!text) return;
  if (!state.ai || !$("refineToggle").checked) { $("msgInput").value = ""; return sendText(text); }
  $("sendBtn").disabled = true;
  try {
    const { refined } = await api("/api/refine", { text, history: state.history });
    if (!refined || refined === text) { $("msgInput").value = ""; sendText(text); }
    else showRefine(text, refined);
  } catch { $("msgInput").value = ""; sendText(text); }
  $("sendBtn").disabled = false;
}
function showRefine(original, refined) {
  $("refinedOpt").textContent = `이대로 보내기: ${refined}`;
  $("originalOpt").textContent = `원래대로 보내기: ${original}`;
  $("refinedOpt").onclick = () => { hideRefine(); $("msgInput").value = ""; sendText(refined); };
  $("originalOpt").onclick = () => { hideRefine(); $("msgInput").value = ""; sendText(original); };
  $("refineCard").classList.add("on");
}
function hideRefine() { $("refineCard").classList.remove("on"); }
$("sendBtn").onclick = submitInput;
$("msgInput").onkeydown = (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); submitInput(); } };

let typingOn = false, typingIdle;
$("msgInput").oninput = () => {
  hideRefine();
  if (!$("msgInput").value) return stopTyping();
  if (!typingOn) { typingOn = true; send({ type: "typing", on: true }); }
  clearTimeout(typingIdle); typingIdle = setTimeout(stopTyping, 5000);
};
function stopTyping() {
  clearTimeout(typingIdle);
  if (typingOn) { typingOn = false; send({ type: "typing", on: false }); }
}

// 상대가 입력 중일 때: 표시하고, 목소리 모드면 4초 뒤 대기 안내를 들려준다
let peerTypingTimer;
function setTyping(on) {
  $("typing").textContent = on ? `${state.peer?.name || "상대"}님이 입력하고 있어요…` : "";
  clearTimeout(peerTypingTimer);
  if (on && state.profile?.mode === "voice") {
    peerTypingTimer = setTimeout(() => speak("잠시만요, 입력하고 있어요."), 4000);
  }
}

// AI 답변 추천: 상대 말이 끝날 때마다
let suggestTimer, suggestSeq = 0;
function onPeerFinal() {
  if (!state.ai || state.profile.mode !== "caption") return;
  clearTimeout(suggestTimer);
  suggestTimer = setTimeout(async () => {
    const seq = ++suggestSeq;
    try {
      const { suggestions } = await api("/api/suggest", { history: state.history, purpose: state.prep?.purpose || "" });
      if (seq === suggestSeq && state.peer) fillChips($("aiChips"), suggestions, "ai");
    } catch {}
  }, 500);
}

// ---------- 음성 인식(STT): 목소리 모드 ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, sttWanted = false, sttPaused = false;
function startStt() {
  if (!SR) { addLine("sys", "이 브라우저는 음성 인식을 지원하지 않아요. 크롬을 사용해 주세요.", { record: false }); return; }
  sttWanted = true;
  if (rec) return;
  rec = new SR();
  rec.lang = "ko-KR"; rec.continuous = true; rec.interimResults = true;
  rec.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const text = e.results[i][0].transcript.trim();
      if (!text) continue;
      const final = e.results[i].isFinal;
      send({ type: "caption", text, final });
      if (final) addLine("me", text); else setInterim("me", text);
    }
  };
  rec.onerror = (e) => {
    if (e.error === "not-allowed") { sttWanted = false; addLine("sys", "마이크 권한이 필요해요.", { record: false }); }
  };
  // 크롬은 잠시 조용하면 인식을 멈추므로 통화 중에는 다시 시작한다
  rec.onend = () => { rec = null; if (sttWanted && !sttPaused) startStt(); };
  try { rec.start(); } catch {}
}
function stopStt() { sttWanted = false; if (rec) { try { rec.abort(); } catch {} rec = null; } }

// ---------- 음성 합성(TTS) ----------
function koVoice() { return speechSynthesis.getVoices().find((v) => v.lang?.startsWith("ko")); }
function speak(text) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ko-KR"; const v = koVoice(); if (v) u.voice = v;
  // 읽는 동안 음성 인식을 멈춰 자기 소리가 자막에 섞이지 않게 한다
  u.onstart = () => { if (sttWanted) { sttPaused = true; if (rec) { try { rec.abort(); } catch {} } } };
  u.onend = u.onerror = () => {
    if (sttPaused && !speechSynthesis.pending) { sttPaused = false; if (sttWanted) startStt(); }
  };
  speechSynthesis.speak(u);
}
// 모바일 자동 재생 제한: 버튼을 누를 때 무음으로 한 번 재생해 둔다
function unlockAudio() {
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch {}
  $("remoteAudio").play().catch(() => {});
}

// ---------- 직접 말하기(WebRTC 음성) ----------
let pc = null, localStream = null;
const ICE = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
function newPc() {
  const p = new RTCPeerConnection(ICE);
  p.onicecandidate = (e) => { if (e.candidate) send({ type: "rtc", data: { candidate: e.candidate } }); };
  p.ontrack = (e) => { $("remoteAudio").srcObject = e.streams[0]; $("remoteAudio").play().catch(() => {}); };
  return p;
}
async function startTalk() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch { return toast("마이크를 사용할 수 없어요."); }
  pc = newPc();
  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
  await pc.setLocalDescription(await pc.createOffer());
  send({ type: "rtc", data: { sdp: pc.localDescription } });
  $("talkBtn").textContent = "🎙 말하는 중 (끄기)"; $("talkBtn").classList.add("primary");
}
function stopTalk(notify = true) {
  if (pc) { pc.close(); pc = null; if (notify && state.peer) send({ type: "rtc", data: { bye: true } }); }
  if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
  $("talkBtn").textContent = "🎙 직접 말하기"; $("talkBtn").classList.remove("primary");
}
async function onRtc(d) {
  if (d.bye) return stopTalk(false);
  if (d.sdp?.type === "offer") {
    if (pc) pc.close();
    pc = newPc();
    await pc.setRemoteDescription(d.sdp);
    await pc.setLocalDescription(await pc.createAnswer());
    send({ type: "rtc", data: { sdp: pc.localDescription } });
  } else if (d.sdp?.type === "answer" && pc) {
    await pc.setRemoteDescription(d.sdp);
  } else if (d.candidate && pc) {
    try { await pc.addIceCandidate(d.candidate); } catch {}
  }
}
$("talkBtn").onclick = () => (localStream ? stopTalk() : startTalk());

// ---------- AI API ----------
async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) {
    let msg = "AI 요청에 실패했어요.";
    try { msg = (await r.json()).detail || msg; } catch {}
    throw new Error(msg);
  }
  return r.json();
}

// ---------- 시작 ----------
applyFont();
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};
fetch("/api/config").then((r) => r.json()).then((c) => { state.ai = c.ai; if (state.profile) goHome(); }).catch(() => {});
renderModes();
if (state.profile) { goHome(); connect(); } else show("setup");
</script>
