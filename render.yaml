# Render Blueprint — 저장소를 연결하면 이 설정으로 웹 서비스가 만들어진다
services:
  - type: web
    name: geulsori
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CLAUDE_MODEL
        value: claude-haiku-5-5
      - key: ANTHROPIC_API_KEY
        sync: false   # 값은 Render 화면에서 직접 입력 (저장소에 올리지 않음)
